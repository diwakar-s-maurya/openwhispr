# Egress filter for the OpenWhispr Flatpak (local.surface.OpenWhispr).
# The Flatpak has no network; its only way out is the unix socket
# $XDG_RUNTIME_DIR/openwhispr-net/proxy.sock -> systemd-socket-proxyd -> this proxy.

Port 8899
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 600
MaxClients 64

# Logs go to stderr -> the user journal (run with -d).
LogLevel Connect

# HTTPS tunnels only, to allowlisted host names. tinyproxy resolves the name
# itself; the sandbox never does DNS.
ConnectPort 443
Filter "/etc/openwhispr-net/allowlist.txt"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

DisableViaHeader Yes
